<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Sports Hub | Social Network</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #090a10;
      --card-bg: #131722;
      --input-bg: #1c2130;
      --accent-neon: #00ff88;
      --accent-blue: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-dark: #22293a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; }

    /* FB Header */
    .fb-header {
      background: var(--card-bg); height: 56px; padding: 0 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-dark); position: sticky; top: 0; z-index: 1000;
    }
    .brand { font-weight: 900; font-size: 18px; color: var(--accent-neon); letter-spacing: 0.5px; }
    .search-box { position: relative; width: 260px; }
    .search-box input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border-dark);
      padding: 7px 12px 7px 32px; border-radius: 20px; color: #fff; font-size: 12px; outline: none;
    }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 11px; }

    /* 3-Column Layout */
    .app-layout {
      max-width: 1350px; margin: 0 auto; display: grid;
      grid-template-columns: 260px 1fr 320px; gap: 20px; padding: 20px 16px;
    }

    /* Left Sidebar */
    .sidebar { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 76px; height: calc(100vh - 96px); }
    .menu-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      border-radius: 8px; color: var(--text-main); text-decoration: none; font-size: 13px; font-weight: 600;
    }
    .menu-item:hover { background: var(--card-bg); color: var(--accent-neon); }

    /* Center Feed */
    .feed-section { display: flex; flex-direction: column; gap: 16px; max-width: 680px; margin: 0 auto; width: 100%; }

    /* Filter Chips */
    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .chip {
      background: var(--card-bg); border: 1px solid var(--border-dark); padding: 6px 14px;
      border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; color: var(--text-muted);
    }
    .chip.active { border-color: var(--accent-neon); color: var(--accent-neon); background: rgba(0,255,136,0.05); }

    /* Post Creator */
    .create-card { background: var(--card-bg); border: 1px solid var(--border-dark); border-radius: 12px; padding: 14px; }
    .create-card textarea {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border-dark);
      padding: 10px; border-radius: 8px; color: #fff; outline: none; resize: none; height: 60px; font-size: 13px; margin-bottom: 10px;
    }
    .create-controls { display: flex; justify-content: space-between; align-items: center; }
    .create-controls select {
      background: var(--input-bg); color: var(--accent-neon); border: 1px solid var(--border-dark);
      padding: 6px 10px; border-radius: 6px; font-size: 12px; outline: none;
    }
    .btn-publish {
      background: var(--accent-neon); color: #000; border: none; padding: 8px 20px;
      font-weight: bold; border-radius: 20px; cursor: pointer; font-size: 12px;
    }

    /* Post Cards */
    .post-card { background: var(--card-bg); border: 1px solid var(--border-dark); border-radius: 12px; padding: 14px; }
    .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .post-badge { font-size: 9px; padding: 3px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
    .post-actions { display: flex; gap: 15px; border-top: 1px solid var(--border-dark); border-bottom: 1px solid var(--border-dark); padding: 8px 0; margin-top: 10px; }
    .action-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .action-btn.liked { color: var(--accent-neon); }

    /* Comment Section */
    .comments-box { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .comment-item { background: var(--input-bg); padding: 6px 10px; border-radius: 8px; font-size: 11px; }
    .comment-input-wrap { display: flex; gap: 6px; margin-top: 8px; }
    .comment-input-wrap input {
      flex: 1; background: var(--input-bg); border: 1px solid var(--border-dark);
      border-radius: 15px; padding: 6px 12px; color: #fff; font-size: 11px; outline: none;
    }

    /* Right Messenger Drawer */
    .messenger-box {
      background: var(--card-bg); border: 1px solid var(--border-dark); border-radius: 12px;
      height: 480px; display: flex; flex-direction: column; position: sticky; top: 76px;
    }
    .messenger-header { padding: 12px; border-bottom: 1px solid var(--border-dark); font-size: 13px; font-weight: bold; color: var(--accent-neon); }
    .messenger-body { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg-bubble { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 12px; }
    .msg-bubble.me { align-self: flex-end; background: var(--accent-neon); color: #000; font-weight: 600; }
    .msg-bubble.other { align-self: flex-start; background: var(--input-bg); color: #fff; border: 1px solid var(--border-dark); }
    .messenger-footer { padding: 8px; border-top: 1px solid var(--border-dark); display: flex; gap: 6px; }
    .messenger-footer input { flex: 1; background: var(--input-bg); border: 1px solid var(--border-dark); border-radius: 15px; padding: 6px 12px; color: #fff; font-size: 12px; outline: none; }

    @media (max-width: 900px) {
      .app-layout { grid-template-columns: 1fr; }
      .sidebar, .messenger-box { display: none; }
    }
  </style>
</head>
<body>

  <header class="fb-header">
    <div class="brand"><i class="fa-solid fa-gamepad"></i> E-SPORTS HUB</div>
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Search gamers or keyword...">
    </div>
    <div id="user-display" style="font-size: 12px; color: var(--accent-neon); font-weight: bold;">Connecting...</div>
  </header>

  <div class="app-layout">
    
    <aside class="sidebar">
      <a href="#" class="menu-item"><i class="fa-solid fa-house"></i> News Feed</a>
      <a href="#" class="menu-item"><i class="fa-solid fa-trophy"></i> Tournaments</a>
      <a href="#" class="menu-item"><i class="fa-solid fa-users"></i> Squads & Clans</a>
      <a href="#" class="menu-item"><i class="fa-solid fa-briefcase"></i> Host Jobs</a>
    </aside>

    <main class="feed-section">
      
      <!-- Filters -->
      <div class="filter-bar">
        <button class="chip active" data-category="all">All Feed</button>
        <button class="chip" data-category="clip">🎮 Clips</button>
        <button class="chip" data-category="hire">🎯 Player Hiring</button>
        <button class="chip" data-category="analysis">📊 Coach Strategy</button>
        <button class="chip" data-category="host">🎙️ Host Positions</button>
      </div>

      <!-- Post Creator -->
      <div class="create-card">
        <textarea id="post-input" placeholder="Share clips, recruit players, or post tournament updates..."></textarea>
        <div class="create-controls">
          <select id="post-type">
            <option value="clip">🎮 Gameplay Clip</option>
            <option value="hire">🎯 Squad Hiring</option>
            <option value="analysis">📊 Strategy / Analysis</option>
            <option value="host">🎙️ Host Application</option>
          </select>
          <button id="publish-btn" class="btn-publish">Publish Post</button>
        </div>
      </div>

      <!-- Live Dynamic Feed -->
      <div id="feed-container" style="display:flex; flex-direction:column; gap:14px;"></div>
    </main>

    <!-- Right Live Messenger -->
    <aside>
      <div class="messenger-box">
        <div class="messenger-header"><i class="fa-solid fa-comments"></i> Squad Live Chat</div>
        <div id="chat-messages" class="messenger-body"></div>
        <div class="messenger-footer">
          <input type="text" id="chat-input" placeholder="Type message...">
          <button id="chat-send-btn" style="background:var(--accent-neon); border:none; width:30px; height:30px; border-radius:50%; cursor:pointer;"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </aside>

  </div>

  <script src="app.js" type="module"></script>
</body>
        </html>
