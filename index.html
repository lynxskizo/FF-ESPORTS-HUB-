<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Sports Hub - Multi-Role E2EE Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #090a10;
      --card-bg: #141722;
      --accent-neon: #00ff88;
      --accent-purple: #70a1ff;
      --accent-orange: #ffa502;
      --accent-red: #ff4757;
      --text-main: #f1f5f9;
      --text-muted: #8e9bb0;
      --border-dark: #23283b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Arial, sans-serif;
      padding-bottom: 75px;
    }

    .top-header {
      background: var(--card-bg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-dark);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-logo { font-size: 18px; font-weight: bold; color: var(--accent-neon); }
    .user-tag { font-size: 12px; color: var(--accent-purple); font-weight: bold; }

    .main-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* FB Style Search Card */
    .search-card {
      background: var(--card-bg);
      border: 1px solid var(--border-dark);
      padding: 12px;
      border-radius: 10px;
    }
    .search-input-group { display: flex; gap: 8px; }
    .search-input-group input {
      flex: 1; background: #0d0e17; border: 1px solid var(--border-dark);
      padding: 8px 12px; border-radius: 6px; color: #fff; outline: none; font-size: 12px;
    }
    .search-btn {
      background: var(--accent-purple); color: #000; border: none; padding: 8px 14px;
      font-weight: bold; border-radius: 6px; cursor: pointer;
    }
    .search-results { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }

    /* Smart Feed Post Input Box */
    .create-post-card {
      background: var(--card-bg);
      border: 1px solid var(--border-dark);
      border-radius: 10px;
      padding: 15px;
    }
    .post-input-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .avatar-sm {
      width: 38px; height: 38px; border-radius: 50%; background: var(--accent-neon);
      display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; flex-shrink: 0;
    }
    .create-post-card textarea {
      width: 100%; background: #0d0e17; border: 1px solid var(--border-dark);
      padding: 10px; border-radius: 8px; color: #fff; outline: none; resize: none; height: 60px; font-family: inherit;
    }
    .post-controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-dark); padding-top: 10px; }
    .type-select {
      background: #0d0e17; color: var(--accent-neon); border: 1px solid var(--border-dark);
      padding: 6px 10px; border-radius: 6px; outline: none; font-size: 12px;
    }
    .post-btn {
      background: var(--accent-neon); color: #000; border: none; padding: 8px 18px; font-weight: bold; border-radius: 6px; cursor: pointer;
    }

    /* Category Filter Chips */
    .filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
    .chip {
      background: var(--card-bg); border: 1px solid var(--border-dark); padding: 6px 12px;
      border-radius: 15px; font-size: 11px; cursor: pointer; white-space: nowrap; color: var(--text-muted);
    }
    .chip.active { border-color: var(--accent-neon); color: var(--accent-neon); }

    /* Feed Post Items */
    .feed-container { display: flex; flex-direction: column; gap: 12px; }
    .feed-card {
      background: var(--card-bg); border: 1px solid var(--border-dark); border-radius: 10px; padding: 14px;
    }
    .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .user-info h4 { font-size: 13px; color: #fff; }
    .user-info span { font-size: 10px; color: var(--text-muted); }
    .role-badge { font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }

    /* Live Chat Messenger Box */
    .messenger-box {
      background: var(--card-bg); border: 1px solid var(--border-dark); border-radius: 10px; padding: 15px;
    }
    .chat-header {
      border-bottom: 1px solid var(--border-dark); padding-bottom: 8px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .chat-messages {
      height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px;
    }
    .chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 12px; }
    .chat-msg.me { align-self: flex-end; background: rgba(0, 255, 136, 0.15); border: 1px solid var(--accent-neon); color: #fff; }
    .chat-msg.other { align-self: flex-start; background: #0d0e17; border: 1px solid var(--border-dark); color: #fff; }

    /* Bottom Fixed Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background-color: var(--card-bg);
      display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border-dark); z-index: 9999;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 11px; width: 25%; }
    .nav-item i { font-size: 18px; margin-bottom: 3px; }
    .nav-item.active { color: var(--accent-neon); }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="brand-logo"><i class="fa-solid fa-gamepad"></i> E-SPORTS HUB</div>
    <span id="header-user" class="user-tag"><i class="fa-solid fa-user"></i> Guest</span>
  </header>

  <div class="main-container">

    <!-- User & Role Search Card -->
    <div class="search-card">
      <div class="search-input-group">
        <input type="text" id="search-input" placeholder="Search Player, Host, Coach, or Org...">
        <button id="search-btn" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- Smart Multi-Role Post Creator -->
    <div class="create-post-card">
      <div class="post-input-row">
        <div class="avatar-sm">YOU</div>
        <textarea id="post-input" placeholder="Share gameplay, recruit players, share coach strategies, or post host jobs..."></textarea>
      </div>
      <div class="post-controls">
        <select id="post-type-select" class="type-select">
          <option value="clip">🎮 Gameplay / Post</option>
          <option value="hire">🎯 Squad Hiring (Player)</option>
          <option value="analysis">📊 Coach Breakdown</option>
          <option value="host">🎙️ Host / Organizer Job</option>
        </select>
        <button id="publish-btn" class="post-btn">Publish</button>
      </div>
    </div>

    <!-- Category Filter Chips -->
    <div class="filter-chips">
      <span class="chip active" onclick="filterFeed('all', this)">All Feeds</span>
      <span class="chip" onclick="filterFeed('clip', this)">Gameplay Clips</span>
      <span class="chip" onclick="filterFeed('hire', this)">Player Hiring</span>
      <span class="chip" onclick="filterFeed('analysis', this)">Coach Analysis</span>
      <span class="chip" onclick="filterFeed('host', this)">Host Positions</span>
    </div>

    <!-- Smart Feed Container -->
    <div id="feed-container" class="feed-container"></div>

    <!-- E2EE Squad Live Chat Messenger -->
    <div class="messenger-box">
      <div class="chat-header">
        <h3 style="font-size: 13px; color: var(--accent-neon);"><i class="fa-solid fa-lock"></i> Encrypted Live Chat</h3>
        <span style="font-size: 10px; color: var(--accent-neon); background: rgba(0,255,136,0.1); padding: 2px 6px; border-radius: 4px;"><i class="fa-solid fa-shield-halved"></i> E2EE Active</span>
      </div>

      <div id="chat-messages" class="chat-messages">
        <div style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 20px;">Connecting to encrypted stream...</div>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <input type="text" id="chat-input" placeholder="Type encrypted message..." style="flex: 1; background: #0d0e17; border: 1px solid var(--border-dark); border-radius: 6px; padding: 8px 12px; color: #fff; outline: none; font-size: 12px;">
        <button id="chat-send-btn" style="background: var(--accent-neon); color: #000; border: none; padding: 8px 15px; font-weight: bold; border-radius: 6px; cursor: pointer;"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>Feed</span></a>
    <a href="post.html" class="nav-item"><i class="fa-solid fa-trophy"></i><span>Tournaments</span></a>
    <a href="userprofile.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Teams</span></a>
    <a href="userprofile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a>
  </nav>

  <script src="app.js" type="module"></script>
  <script>
    function filterFeed(category, chipElement) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chipElement.classList.add('active');

      const cards = document.querySelectorAll('.feed-card');
      cards.forEach(card => {
        if (category === 'all' || card.getAttribute('data-type') === category) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
