<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusGG - Global Esports & Gaming Hub</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              bg: '#090d16',
              cyan: '#00f0ff',
              pink: '#ff007f',
              dark: '#111827',
              surface: '#1f2937'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Custom Application Stylesheet -->
  <style>
    @tailwind base;
    @tailwind components;
    @tailwind utilities;

    @layer utilities {
      .glass-panel {
        background: rgba(17, 24, 39, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 240, 255, 0.15);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }
      .cyber-glow {
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.3);
      }
      .cyber-border {
        border-color: #00f0ff;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 240, 255, 0.4);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 240, 255, 0.7);
      }
    }
    body {
      overflow-x: hidden;
    }
  </style>
</head>
<body class="bg-cyber-bg text-zinc-100 min-h-screen font-sans antialiased flex flex-col justify-between">

  <!-- Top Navigation Bar (Gaming Style Facebook Navbar) -->
  <header class="sticky top-0 z-50 glass-panel border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
      
      <!-- Brand & Search Bar -->
      <div class="flex items-center space-x-4">
        <a href="/feed" data-link class="text-2xl font-black tracking-widest text-cyan-400 cyber-glow flex items-center space-x-2">
          <span>NEXUS.GG</span>
        </a>
        <div class="hidden lg:flex items-center bg-zinc-900 border border-zinc-800 rounded-full px-3 py-1.5 space-x-2 w-64">
          <span class="text-zinc-500 text-sm">🔍</span>
          <input type="text" placeholder="Search EWC teams, players..." class="bg-transparent text-xs text-zinc-200 focus:outline-none w-full">
        </div>
      </div>

      <!-- Center Navigation Tabs (Like FB Feeds, Groups, Gaming, Watch) -->
      <nav class="hidden md:flex space-x-2">
        <a href="/feed" data-link class="px-4 py-2 rounded-xl hover:bg-zinc-800/60 transition text-cyan-400 font-semibold text-sm flex items-center space-x-1.5">
          <span>🏠</span><span>Feed</span>
        </a>
        <a href="/squads" data-link class="px-4 py-2 rounded-xl hover:bg-zinc-800/60 transition text-zinc-400 hover:text-cyan-400 font-semibold text-sm flex items-center space-x-1.5">
          <span>🛡️</span><span>EWC Squads</span>
        </a>
        <a href="/gaming-video" data-link class="px-4 py-2 rounded-xl hover:bg-zinc-800/60 transition text-zinc-400 hover:text-cyan-400 font-semibold text-sm flex items-center space-x-1.5">
          <span>🎮</span><span>Live Stream</span>
        </a>
        <a href="/messenger" data-link class="px-4 py-2 rounded-xl hover:bg-zinc-800/60 transition text-zinc-400 hover:text-cyan-400 font-semibold text-sm flex items-center space-x-1.5">
          <span>💬</span><span>Comms</span>
        </a>
      </nav>

      <!-- Right Action Panel (Settings, Account Center, Notifications) -->
      <div class="flex items-center space-x-3">
        <a href="/settings" data-link class="p-2 rounded-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 hover:text-cyan-400 transition" title="Account Center & Settings">
          ⚙️
        </a>
        <a href="/settings" data-link class="flex items-center space-x-2 p-1 rounded-full hover:ring-2 hover:ring-cyan-400 transition">
          <img id="nav-user-avatar" src="https://via.placeholder.com/36" class="w-9 h-9 rounded-full object-cover border border-cyan-500/50" alt="Avatar">
        </a>
      </div>

    </div>
  </header>

  <!-- SPA Dynamic Root Container -->
  <main id="app-root" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Views will be loaded dynamically here -->
  </main>

  <!-- Footer Information -->
  <footer class="border-t border-zinc-800 py-4 text-center text-xs text-zinc-500">
    <p>&copy; 2026 NexusGG Esports Network. Inspired by global social layouts, tailored exclusively for EWC Approved Games.</p>
  </footer>

  <!-- Application Script Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, getDoc, setDoc, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ==========================================
    // 1. FIREBASE CONFIGURATION (Placeholder)
    // ==========================================
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "nexusgg-platform.firebaseapp.com",
      projectId: "nexusgg-platform",
      storageBucket: "nexusgg-platform.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // EWC (Esports World Cup) Approved Games Official List
    const ewcApprovedGames = [
      { id: 'cs2', name: 'Counter-Strike 2 (CS2)', publisher: 'Valve' },
      { id: 'dota2', name: 'Dota 2', publisher: 'Valve' },
      { id: 'lol', name: 'League of Legends', publisher: 'Riot Games' },
      { id: 'valorant', name: 'VALORANT', publisher: 'Riot Games' },
      { id: 'pubg_mobile', name: 'PUBG Mobile', publisher: 'Krafton' },
      { id: 'ff', name: 'Free Fire', publisher: 'Garena' },
      { id: 'mlbb', name: 'Mobile Legends: Bang Bang', publisher: 'Moonton' },
      { id: 'rocket_league', name: 'Rocket League', publisher: 'Psyonix' },
      { id: 'fortnite', name: 'Fortnite', publisher: 'Epic Games' },
      { id: 'apex_legends', name: 'Apex Legends', publisher: 'EA' },
      { id: 'overwatch2', name: 'Overwatch 2', publisher: 'Blizzard' },
      { id: 'tekken8', name: 'Tekken 8', publisher: 'Bandai Namco' },
      { id: 'sf6', name: 'Street Fighter 6', publisher: 'Capcom' },
      { id: 'r6s', name: 'Rainbow Six Siege', publisher: 'Ubisoft' }
    ];

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // ==========================================
    // 2. VIEW CONTROLLERS
    // ==========================================

    // Feed Controller (Home Feed, Stories, Status Updates, Reels)
    class FeedController {
      constructor() {
        this.containerId = 'feed-stream';
        this.initListeners();
        this.loadPosts();
      }

      render() {
        return `
          <div class="max-w-3xl mx-auto space-y-6">
            <!-- Stories / Highlights Bar -->
            <div class="grid grid-cols-4 gap-3">
              <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-cyan-400 transition min-h-[110px]">
                <span class="text-2xl text-cyan-400 mb-1">+</span>
                <span class="text-xs font-bold">Add Story / Clip</span>
              </div>
              <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer relative overflow-hidden group min-h-[110px]">
                <div class="absolute inset-0 bg-cover bg-center opacity-40 group-hover:scale-105 transition" style="background-image:url('https://via.placeholder.com/150')"></div>
                <span class="relative text-xs font-bold text-zinc-100 mt-auto">Viper_CS2</span>
              </div>
              <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer relative overflow-hidden group min-h-[110px]">
                <div class="absolute inset-0 bg-cover bg-center opacity-40 group-hover:scale-105 transition" style="background-image:url('https://via.placeholder.com/150')"></div>
                <span class="relative text-xs font-bold text-zinc-100 mt-auto">Nexus_Alpha</span>
              </div>
              <div class="glass-panel p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer relative overflow-hidden group min-h-[110px]">
                <div class="absolute inset-0 bg-cover bg-center opacity-40 group-hover:scale-105 transition" style="background-image:url('https://via.placeholder.com/150')"></div>
                <span class="relative text-xs font-bold text-zinc-100 mt-auto">EWC_Official</span>
              </div>
            </div>

            <!-- Create Post Box (Status Update / Broadcast) -->
            <div class="glass-panel p-6 rounded-2xl">
              <form id="create-post-form" class="space-y-4">
                <textarea id="post-text" rows="3" placeholder="What's your tactical update or EWC match highlight today, operator?" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-sm text-zinc-100 focus:outline-none focus:border-cyan-400 transition resize-none" required></textarea>
                <div class="flex justify-between items-center pt-2 border-t border-zinc-800">
                  <div class="flex space-x-3 text-xs text-zinc-400">
                    <span class="cursor-pointer hover:text-cyan-400">🎥 Add Gaming Reel</span>
                    <span class="cursor-pointer hover:text-cyan-400">📍 Tag EWC Tournament</span>
                  </div>
                  <button type="submit" class="bg-cyan-500 text-zinc-950 font-bold px-6 py-2 rounded-lg text-sm hover:bg-cyan-400 transition shadow-[0_0_10px_rgba(0,240,255,0.3)]">
                    Publish Post
                  </button>
                </div>
              </form>
            </div>

            <!-- Post Stream -->
            <div id="${this.containerId}" class="space-y-6">
              <div class="text-center py-8 text-zinc-500 animate-pulse">Synchronizing global esports feeds...</div>
            </div>
          </div>
        `;
      }

      initListeners() {
        this.submitHandler = async (e) => {
          if (e.target && e.target.id === 'create-post-form') {
            e.preventDefault();
            const textInput = document.getElementById('post-text');
            const text = textInput.value.trim();
            if (!text) return;

            const user = auth.currentUser;
            try {
              await addDoc(collection(db, "posts"), {
                authorId: user ? user.uid : 'anon',
                authorName: user ? (user.displayName || user.email.split('@')[0]) : 'CyberOperator',
                authorAvatar: user ? (user.photoURL || 'https://via.placeholder.com/40') : 'https://via.placeholder.com/40',
                content: text,
                likes: [],
                commentsCount: 0,
                createdAt: serverTimestamp()
              });
              textInput.value = '';
              this.loadPosts();
            } catch (err) {
              console.error("Error posting:", err);
            }
          }
        };
        document.addEventListener('submit', this.submitHandler);
      }

      async loadPosts() {
        const container = document.getElementById(this.containerId);
        if (!container) return;

        try {
          const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
          const snapshot = await getDocs(q);

          if (snapshot.empty) {
            container.innerHTML = `<div class="glass-panel p-6 rounded-xl text-center text-zinc-500">No timeline posts found. Start the conversation!</div>`;
            return;
          }

          let html = '';
          snapshot.forEach((docSnap) => {
            const p = docSnap.data();
            html += `
              <div class="glass-panel p-6 rounded-2xl space-y-4">
                <div class="flex items-center space-x-3">
                  <img src="${p.authorAvatar}" class="w-10 h-10 rounded-full object-cover border border-cyan-500/50" alt="Avatar">
                  <div>
                    <h4 class="font-bold text-sm text-zinc-100">${escapeHtml(p.authorName)}</h4>
                    <span class="text-[10px] text-zinc-500">EWC Verified Player</span>
                  </div>
                </div>
                <p class="text-sm text-zinc-300 leading-relaxed">${escapeHtml(p.content)}</p>
                <div class="flex items-center space-x-6 pt-3 border-t border-zinc-800 text-xs text-zinc-400">
                  <button class="hover:text-cyan-400 transition flex items-center space-x-1"><span>⚡</span><span>${p.likes ? p.likes.length : 0} Resonance</span></button>
                  <button class="hover:text-cyan-400 transition flex items-center space-x-1"><span>💬</span><span>${p.commentsCount || 0} Comments</span></button>
                  <button class="hover:text-cyan-400 transition ml-auto"><span>🔗 Share Link</span></button>
                </div>
              </div>
            `;
          });
          container.innerHTML = html;
        } catch (err) {
          console.error("Error loading posts:", err);
          container.innerHTML = `<div class="glass-panel p-6 rounded-xl text-center text-rose-400">Failed to load social feed streams.</div>`;
        }
      }

      destroy() {
        if (this.submitHandler) document.removeEventListener('submit', this.submitHandler);
      }
    }

    // Squads Controller (Team Creation strictly with EWC Approved Games)
    class SquadsController {
      constructor() {
        this.containerId = 'squads-list-container';
        this.initListeners();
        this.loadSquads();
      }

      render() {
        const gameOptionsHtml = ewcApprovedGames.map(g => `<option value="${g.id}" class="bg-zinc-900">${g.name} (${g.publisher})</option>`).join('');

        return `
          <div class="max-w-6xl mx-auto space-y-8">
            <!-- Header & Team Creation Launcher -->
            <div class="glass-panel p-6 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <span class="text-xs uppercase tracking-widest text-cyan-400 font-semibold">EWC Roster Directory</span>
                <h1 class="text-2xl md:text-3xl font-black uppercase cyber-glow mt-1">Official EWC Squads & Teams</h1>
              </div>
              <button id="open-create-squad-modal" class="bg-cyan-500 text-zinc-950 font-bold px-6 py-2.5 rounded-xl text-sm hover:bg-cyan-400 transition shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                + Create EWC Team
              </button>
            </div>

            <!-- Create Squad Modal (Hidden by default) -->
            <div id="squad-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div class="glass-panel max-w-lg w-full p-6 rounded-2xl border border-cyan-500/40 space-y-4">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <h3 class="font-bold text-lg text-cyan-400">Register New EWC Esports Team</h3>
                  <button id="close-squad-modal" class="text-zinc-400 hover:text-zinc-100 text-lg">✕</button>
                </div>
                <form id="create-squad-form" class="space-y-4">
                  <div>
                    <label class="block text-xs uppercase font-semibold text-zinc-400 mb-1.5">Team Name / Clan Tag</label>
                    <input type="text" id="squad-name-input" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-100 focus:outline-none focus:border-cyan-400" placeholder="e.g. Nexus Gaming Elite" required>
                  </div>
                  <div>
                    <label class="block text-xs uppercase font-semibold text-zinc-400 mb-1.5">Select EWC Approved Game</label>
                    <select id="squad-game-select" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-100 focus:outline-none focus:border-cyan-400 cursor-pointer" required>
                      <option value="">-- Choose EWC Game Category --</option>
                      ${gameOptionsHtml}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs uppercase font-semibold text-zinc-400 mb-1.5">Region</label>
                    <input type="text" id="squad-region-input" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-100 focus:outline-none focus:border-cyan-400" placeholder="e.g. South Asia / Global" required>
                  </div>
                  <div class="flex justify-end space-x-3 pt-3 border-t border-zinc-800">
                    <button type="button" id="cancel-squad-modal" class="px-4 py-2 rounded-xl text-xs font-semibold bg-zinc-800 text-zinc-300 hover:bg-zinc-700">Cancel</button>
                    <button type="submit" class="px-6 py-2 rounded-xl text-xs font-bold bg-cyan-500 text-zinc-950 hover:bg-cyan-400">Launch Roster</button>
                  </div>
                </form>
              </div>
            </div>

            <!-- Squads Grid Display -->
            <div id="${this.containerId}" class="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div class="glass-panel p-6 rounded-2xl text-center text-zinc-500 col-span-3 animate-pulse">Loading verified EWC teams...</div>
            </div>
          </div>
        `;
      }

      initListeners() {
        this.clickHandler = (e) => {
          const modal = document.getElementById('squad-modal');
          if (e.target && e.target.id === 'open-create-squad-modal') {
            modal.classList.remove('hidden');
          }
          if (e.target && (e.target.id === 'close-squad-modal' || e.target.id === 'cancel-squad-modal')) {
            modal.classList.add('hidden');
          }
        };

        this.submitHandler = async (e) => {
          if (e.target && e.target.id === 'create-squad-form') {
            e.preventDefault();
            const name = document.getElementById('squad-name-input').value.trim();
            const gameId = document.getElementById('squad-game-select').value;
            const region = document.getElementById('squad-region-input').value.trim();

            if (!name || !gameId) return;

            const selectedGameObj = ewcApprovedGames.find(g => g.id === gameId);
            const user = auth.currentUser;

            try {
              await addDoc(collection(db, "squads"), {
                squadName: name,
                gameTitle: selectedGameObj ? selectedGameObj.name : gameId,
                region: region || 'Global',
                ownerId: user ? user.uid : 'anon',
                rosterCount: 1,
                maxRoster: 5,
                createdAt: serverTimestamp()
              });

              document.getElementById('squad-modal').classList.add('hidden');
              document.getElementById('create-squad-form').reset();
              this.loadSquads();
            } catch (err) {
              console.error("Error creating squad:", err);
            }
          }
        };

        document.addEventListener('click', this.clickHandler);
        document.addEventListener('submit', this.submitHandler);
      }

      async loadSquads() {
        const container = document.getElementById(this.containerId);
        if (!container) return;

        try {
          const snapshot = await getDocs(collection(db, "squads"));
          if (snapshot.empty) {
            container.innerHTML = `<div class="glass-panel p-6 rounded-xl text-center text-zinc-500 col-span-3">No EWC squads registered yet. Create the first professional team!</div>`;
            return;
          }

          let html = '';
          snapshot.forEach((docSnap) => {
            const s = docSnap.data();
            html += `
              <div class="glass-panel p-6 rounded-2xl border border-cyan-500/20 flex flex-col justify-between space-y-4 hover:border-cyan-400 transition">
                <div>
                  <span class="px-2.5 py-1 rounded-full text-[10px] font-mono bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 uppercase">${escapeHtml(s.gameTitle)}</span>
                  <h3 class="font-bold text-lg text-zinc-100 mt-2">${escapeHtml(s.squadName)}</h3>
                  <p class="text-xs text-zinc-400 mt-1">Region: ${escapeHtml(s.region)}</p>
                </div>
                <div class="flex items-center justify-between pt-4 border-t border-zinc-800 text-xs">
                  <span class="text-emerald-400 font-semibold">● Slots: ${s.rosterCount || 1} / ${s.maxRoster || 5}</span>
                  <button class="px-4 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 hover:bg-cyan-500 hover:text-zinc-950 font-bold transition">Apply / Join</button>
                </div>
              </div>
            `;
          });
          container.innerHTML = html;
        } catch (err) {
          console.error("Error loading squads:", err);
          container.innerHTML = `<div class="glass-panel p-6 rounded-xl text-center text-rose-400 col-span-3">Failed to load EWC rosters.</div>`;
        }
      }

      destroy() {
        if (this.clickHandler) document.removeEventListener('click', this.clickHandler);
        if (this.submitHandler) document.removeEventListener('submit', this.submitHandler);
      }
    }

    // Gaming Video Stream Hub Controller (Facebook Gaming Style)
    class GamingVideoController {
      render() {
        return `
          <div class="max-w-6xl mx-auto space-y-6">
            <div class="glass-panel p-6 rounded-2xl flex justify-between items-center">
              <div>
                <span class="text-xs uppercase tracking-widest text-cyan-400 font-semibold">Live Gaming Hub</span>
                <h1 class="text-2xl font-black uppercase cyber-glow mt-1">Global Esports Live Broadcasts</h1>
              </div>
              <span class="px-3 py-1 rounded-full text-xs bg-rose-500/20 text-rose-400 border border-rose-500/40 animate-pulse font-bold">● LIVE NOW</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              <div class="glass-panel rounded-2xl overflow-hidden border border-zinc-800 group">
                <div class="h-48 bg-zinc-900 relative flex items-center justify-center bg-cover bg-center" style="background-image:url('https://via.placeholder.com/400x200')">
                  <span class="absolute top-3 left-3 px-2 py-0.5 rounded text-[10px] font-bold bg-black/60 text-cyan-400 border border-cyan-500/30">CS2 EWC Finals</span>
                </div>
                <div class="p-4 space-y-2">
                  <h3 class="font-bold text-sm text-zinc-100 group-hover:text-cyan-400 transition">Grand Finals: FaZe vs Vitality - Map 3 Decider</h3>
                  <p class="text-xs text-zinc-400">Streamed by Nexus Esports Official</p>
                </div>
              </div>
              <div class="glass-panel rounded-2xl overflow-hidden border border-zinc-800 group">
                <div class="h-48 bg-zinc-900 relative flex items-center justify-center bg-cover bg-center" style="background-image:url('https://via.placeholder.com/400x200')">
                  <span class="absolute top-3 left-3 px-2 py-0.5 rounded text-[10px] font-bold bg-black/60 text-cyan-400 border border-cyan-500/30">PUBG Mobile Global</span>
                </div>
                <div class="p-4 space-y-2">
                  <h3 class="font-bold text-sm text-zinc-100 group-hover:text-cyan-400 transition">Squad Showdown: Erangel Survival & Clutch Moments</h3>
                  <p class="text-xs text-zinc-400">Streamed by ViperOperator</p>
                </div>
              </div>
              <div class="glass-panel rounded-2xl overflow-hidden border border-zinc-800 group">
                <div class="h-48 bg-zinc-900 relative flex items-center justify-center bg-cover bg-center" style="background-image:url('https://via.placeholder.com/400x200')">
                  <span class="absolute top-3 left-3 px-2 py-0.5 rounded text-[10px] font-bold bg-black/60 text-cyan-400 border border-cyan-500/30">VALORANT Champions</span>
                </div>
                <div class="p-4 space-y-2">
                  <h3 class="font-bold text-sm text-zinc-100 group-hover:text-cyan-400 transition">Ascendant Ranked Grind & Radiant Tactical Breakdowns</h3>
                  <p class="text-xs text-zinc-400">Streamed by AlphaTactics</p>
                </div>
              </div>
            </div>
          </div>
        `;
      }
      destroy() {}
    }

    // Messenger Controller (Secure Channels & Vanishing Mode chat)
    class MessengerController {
      constructor() {
        this.channel = 'squad-global';
        this.unsubscribe = null;
        this.initListeners();
        this.subscribeMessages();
      }

      render() {
        return `
          <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-6 h-[75vh]">
            <div class="glass-panel p-4 rounded-2xl space-y-2 overflow-y-auto">
              <h3 class="text-xs font-bold uppercase tracking-wider text-cyan-400 px-2 mb-2">Comms Channels</h3>
              <button data-chan="squad-global" class="chan-btn w-full text-left px-4 py-3 rounded-xl bg-cyan-500/10 text-cyan-400 font-semibold border border-cyan-500/35 transition flex items-center justify-between">
                <span># Squad Global</span><span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              </button>
              <button data-chan="clan-command" class="chan-btn w-full text-left px-4 py-3 rounded-xl hover:bg-zinc-800/60 text-zinc-400 hover:text-zinc-100 transition">
                <span># Clan Command</span>
              </button>
              <button data-chan="ewc-scrims" class="chan-btn w-full text-left px-4 py-3 rounded-xl hover:bg-zinc-800/60 text-zinc-400 hover:text-zinc-100 transition">
                <span># EWC Scrims Arena</span>
              </button>
            </div>
            <div class="glass-panel md:col-span-3 rounded-2xl flex flex-col overflow-hidden">
              <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950/40">
                <h4 id="chan-title" class="font-bold text-sm text-zinc-100"># Squad Global</h4>
                <span class="text-xs text-emerald-400 font-medium">● Encrypted Relay</span>
              </div>
              <div id="chat-stream" class="flex-grow p-6 overflow-y-auto space-y-4 flex flex-col">
                <div class="text-center text-xs text-zinc-500 my-auto animate-pulse">Establishing encrypted chat link...</div>
              </div>
              <form id="chat-form" class="p-4 border-t border-zinc-800 bg-zinc-950/40 flex items-center space-x-3">
                <input type="text" id="chat-input" placeholder="Type tactical message..." autocomplete="off" class="flex-grow bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-100 focus:outline-none focus:border-cyan-400" required>
                <button type="submit" class="bg-cyan-500 text-zinc-950 font-bold px-6 py-3 rounded-xl text-sm hover:bg-cyan-400 transition">Transmit</button>
              </form>
            </div>
          </div>
        `;
      }

      initListeners() {
        this.clickHandler = (e) => {
          const btn = e.target.closest('.chan-btn');
          if (btn) {
            document.querySelectorAll('.chan-btn').forEach(b => {
              b.className = "chan-btn w-full text-left px-4 py-3 rounded-xl hover:bg-zinc-800/60 text-zinc-400 hover:text-zinc-100 transition";
            });
            btn.className = "chan-btn w-full text-left px-4 py-3 rounded-xl bg-cyan-500/10 text-cyan-400 font-semibold border border-cyan-500/35 transition flex items-center justify-between";
            this.channel = btn.getAttribute('data-chan');
            document.getElementById('chan-title').innerText = btn.querySelector('span').innerText;
            this.subscribeMessages();
          }
        };

        this.submitHandler = async (e) => {
          if (e.target && e.target.id === 'chat-form') {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const user = auth.currentUser;
            try {
              await addDoc(collection(db, "chats", this.channel, "messages"), {
                senderId: user ? user.uid : 'anon',
                senderName: user ? (user.displayName || user.email.split('@')[0]) : 'Operator',
                senderAvatar: user ? (user.photoURL || 'https://via.placeholder.com/32') : 'https://via.placeholder.com/32',
                text: text,
                timestamp: serverTimestamp()
              });
              input.value = '';
            } catch (err) {
              console.error("Error sending message:", err);
            }
          }
        };

        document.addEventListener('click', this.clickHandler);
        document.addEventListener('submit', this.submitHandler);
      }

      subscribeMessages() {
        if (this.unsubscribe) this.unsubscribe();
        const container = document.getElementById('chat-stream');
        if (!container) return;

        const q = query(collection(db, "chats", this.channel, "messages"), orderBy("timestamp", "asc"), limit(40));
        this.unsubscribe = onSnapshot(q, (snapshot) => {
          if (snapshot.empty) {
            container.innerHTML = `<div class="text-center text-xs text-zinc-500 my-auto">No chat logs recorded in this channel.</div>`;
            return;
          }
          let html = '';
          snapshot.forEach((docSnap) => {
            const m = docSnap.data();
            html += `
              <div class="flex items-start space-x-3">
                <img src="${m.senderAvatar}" class="w-8 h-8 rounded-full object-cover border border-cyan-500/40" alt="Avatar">
                <div class="glass-panel p-3 rounded-2xl text-sm max-w-[75%] space-y-1">
                  <span class="font-bold text-xs text-cyan-400">${escapeHtml(m.senderName)}</span>
                  <p class="text-zinc-300">${escapeHtml(m.text)}</p>
                </div>
              </div>
            `;
          });
          container.innerHTML = html;
          container.scrollTop = container.scrollHeight;
        });
      }

      destroy() {
        if (this.unsubscribe) this.unsubscribe();
        if (this.clickHandler) document.removeEventListener('click', this.clickHandler);
        if (this.submitHandler) document.removeEventListener('submit', this.submitHandler);
      }
    }

    // Settings Controller (Account Center, Activity Log, 2FA, Ad Preferences)
    class SettingsController {
      constructor() {
        this.activeTab = 'account-center';
        this.initListeners();
      }

      render() {
        return `
          <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="glass-panel p-4 rounded-2xl space-y-2 h-fit">
              <h3 class="text-xs font-bold uppercase tracking-wider text-cyan-400 px-2 mb-3">Account Center</h3>
              <button data-tab="account-center" class="s-tab w-full text-left px-4 py-3 rounded-xl bg-cyan-500/10 text-cyan-400 font-semibold border border-cyan-500/35 transition">General Profile</button>
              <button data-tab="activity-log" class="s-tab w-full text-left px-4 py-3 rounded-xl hover:bg-zinc-800/60 text-zinc-400 hover:text-zinc-100 transition">Activity Log</button>
              <button data-tab="security-2fa" class="s-tab w-full text-left px-4 py-3 rounded-xl hover:bg-zinc-800/60 text-zinc-400 hover:text-zinc-100 transition">Password & Security (2FA)</button>
              <button data-tab="ad-prefs" class="s-tab w-full text-left px-4 py-3 rounded-xl hover:bg-zinc-800/60 text-zinc-400 hover:text-zinc-100 transition">Ad Preferences</button>
            </div>
            <div class="glass-panel md:col-span-3 p-8 rounded-2xl">
              <div id="settings-content" class="space-y-6">
                <h2 class="text-xl font-black cyber-glow">General Profile Configuration</h2>
                <form id="settings-form" class="space-y-4">
                  <div>
                    <label class="block text-xs uppercase font-semibold text-zinc-400 mb-2">Display Handle / IGN</label>
                    <input type="text" id="set-display-name" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3.5 text-sm text-zinc-100 focus:outline-none focus:border-cyan-400" placeholder="ViperOperator">
                  </div>
                  <div>
                    <label class="block text-xs uppercase font-semibold text-zinc-400 mb-2">Player Bio / Esports Motto</label>
                    <textarea id="set-bio" rows="3" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3.5 text-sm text-zinc-100 focus:outline-none focus:border-cyan-400 resize-none" placeholder="EWC Competitive Entry..."></textarea>
                  </div>
                  <button type="submit" class="bg-cyan-500 text-zinc-950 font-bold px-8 py-3 rounded-xl text-sm hover:bg-cyan-400 transition">Save Changes</button>
                </form>
              </div>
            </div>
          </div>
        `;
      }

      initListeners() {
        this.clickHandler = (e) => {
          const btn = e.target.closest('.s-tab');
          if (btn) {
            document.querySelectorAll('.s-tab').forEach(b => {
              b.className = "s-tab w-full text-left px-4 py-3 rounded-xl hover:bg-zinc-800/60 text-zinc-400 hover:text-zinc-100 transition";
            });
            btn.className = "s-tab w-full text-left px-4 py-3 rounded-xl bg-cyan-500/10 text-cyan-400 font-semibold border border-cyan-500/35 transition";
            this.activeTab = btn.getAttribute('data-tab');
            this.renderTab(this.activeTab);
          }
        };

        this.submitHandler = async (e) => {
          if (e.target && e.target.id === 'settings-form') {
            e.preventDefault();
            alert('Account settings updated successfully!');
          }
        };

        document.addEventListener('click', this.clickHandler);
        document.addEventListener('submit', this.submitHandler);
      }

      renderTab(tab) {
        const content = document.getElementById('settings-content');
        if (!content) return;

        if (tab === 'account-center') {
          content.innerHTML = `
            <h2 class="text-xl font-black cyber-glow">General Profile Configuration</h2>
            <form id="settings-form" class="space-y-4">
              <div>
                <label class="block text-xs uppercase font-semibold text-zinc-400 mb-2">Display Handle / IGN</label>
                <input type="text" id="set-display-name" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3.5 text-sm text-zinc-100 focus:outline-none focus:border-cyan-400" placeholder="ViperOperator">
              </div>
              <div>
                <label class="block text-xs uppercase font-semibold text-zinc-400 mb-2">Player Bio / Esports Motto</label>
                <textarea id="set-bio" rows="3" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3.5 text-sm text-zinc-100 focus:outline-none focus:border-cyan-400 resize-none" placeholder="EWC Competitive Entry..."></textarea>
              </div>
              <button type="submit" class="bg-cyan-500 text-zinc-950 font-bold px-8 py-3 rounded-xl text-sm hover:bg-cyan-400 transition">Save Changes</button>
            </form>
          `;
        } else if (tab === 'activity-log') {
          content.innerHTML = `
            <h2 class="text-xl font-black cyber-glow">Activity Log & Archives</h2>
            <p class="text-xs text-zinc-400">Review past broadcasts, tournament match logs, comments, and search history.</p>
            <div class="glass-panel p-4 rounded-xl text-xs text-zinc-300">No recent security anomalies or restricted entries found in your archive vault.</div>
          `;
        } else if (tab === 'security-2fa') {
          content.innerHTML = `
            <h2 class="text-xl font-black cyber-glow">Password & Security (Two-Factor Authentication)</h2>
            <p class="text-xs text-zinc-400">Protect your EWC player identity with cryptographic 2FA keys.</p>
            <div class="flex items-center justify-between p-4 bg-zinc-950 border border-zinc-800 rounded-xl">
              <div>
                <h4 class="font-bold text-sm text-zinc-100">Authenticator App 2FA</h4>
                <p class="text-xs text-zinc-400">Require security codes from an app like Google Authenticator.</p>
              </div>
              <span class="px-3 py-1 rounded-lg text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">ENABLED</span>
            </div>
          `;
        } else if (tab === 'ad-prefs') {
          content.innerHTML = `
            <h2 class="text-xl font-black cyber-glow">Ad Preferences & Sponsored Gaming Gear</h2>
            <p class="text-xs text-zinc-400">Manage targeting categories for gaming hardware and esports merchandise sponsors.</p>

      destroy() {
        if (this.clickHandler) document.removeEventListener('click', this.clickHandler);
        if (this.submitHandler) document.removeEventListener('submit', this.submitHandler);
      }
    }

    // ==========================================
    // 3. SPA ROUTER
    // ==========================================
    class Router {
      constructor(routes) {
        this.routes = routes;
        window.addEventListener('popstate', () => this.handleRoute());
        document.addEventListener('click', e => {
          const link = e.target.closest('[data-link]');
          if (link) {
            e.preventDefault();
            history.pushState(null, null, link.href);
            this.handleRoute();
          }
        });
      }

      async handleRoute() {
        let path = window.location.pathname;
        if (path === "" || path === "/") path = "/feed";

        const route = this.routes[path] || this.routes['/feed'];
        if (window.activeController && typeof window.activeController.destroy === 'function') {
          window.activeController.destroy();
        }

        const container = document.getElementById('app-root');
        if (container) {
          const ctrl = route.controller ? new route.controller() : null;
          window.activeController = ctrl;
          container.innerHTML = route.render(ctrl);
        }
      }
    }

    const routes = {
      '/feed': { controller: FeedController, render: c => c.render() },
      '/squads': { controller: SquadsController, render: c => c.render() },
      '/gaming-video': { controller: GamingVideoController, render: c => c.render() },
      '/messenger': { controller: MessengerController, render: c => c.render() },
      '/settings': { controller: SettingsController, render: c => c.render() }
    };

    const router = new Router(routes);

    onAuthStateChanged(auth, (user) => {
      if (user && user.photoURL) {
        document.getElementById('nav-user-avatar').src = user.photoURL;
      }
      router.handleRoute();
    });
  </script>
