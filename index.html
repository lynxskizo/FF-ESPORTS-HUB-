<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Esports Pro Hub - Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #050811;
            --surface: #0d1322;
            --surface-glass: rgba(13, 19, 34, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --accent-secondary: #818cf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg-base: #f8fafc;
            --surface: #ffffff;
            --surface-glass: rgba(255, 255, 255, 0.9);
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-glow: rgba(56, 189, 248, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        html { scroll-behavior: smooth; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-enter { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        header {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand i { color: var(--accent); }

        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            color: #050811;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn:hover { opacity: 0.92; transform: translateY(-1px); }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            box-shadow: none;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.04); }

        .btn-danger { background: var(--danger); color: #fff; }

        .wrapper {
            max-width: 1250px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .card {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            margin-bottom: 18px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            gap: 20px;
        }

        @media(max-width: 1024px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        .hidden { display: none !important; }

        .input-box {
            position: relative;
            margin-bottom: 14px;
        }
        .input-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px 12px 42px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        select.form-control { padding-left: 14px; cursor: pointer; }

        .auth-card { max-width: 420px; margin: 40px auto; text-align: center; }

        .post-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }
        .avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            color: #050811;
        }
        .badge {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }
        .actions-bar {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
            margin: 12px 0;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .action-btn:hover { background: rgba(255,255,255,0.04); color: var(--accent); }
        .action-btn.active { color: var(--danger); }

        /* Advanced Notification Toast */
        #toastBox {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--surface);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-size: 13px;
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand"><i class="fa-solid fa-shield-cat"></i> NEXUS PRO HUB</div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button class="btn btn-outline" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i> Theme</button>
            <div id="headerBadge"></div>
        </div>
    </header>

    <div class="wrapper">
        <!-- Auth Section -->
        <div id="authSection" class="card auth-card animate-enter">
            <h2 id="authTitle" style="color: var(--accent); margin-bottom: 6px; font-size: 22px;">Portal Authentication</h2>
            <p id="authSub" style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Secure login to your credentials</p>

            <form id="loginForm">
                <div class="input-box"><i class="fa-solid fa-envelope"></i><input type="email" id="logEmail" class="form-control" placeholder="Email" required></div>
                <div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="logPass" class="form-control" placeholder="Password" required></div>
                <button type="submit" class="btn" style="width: 100%;">Sign In</button>
            </form>

            <form id="signupForm" class="hidden">
                <div class="input-box"><i class="fa-solid fa-user"></i><input type="text" id="signName" class="form-control" placeholder="Full Name / IGN" required></div>
                <div class="input-box"><i class="fa-solid fa-id-badge"></i><input type="text" id="signUid" class="form-control" placeholder="Gaming UID" required></div>
                <div class="input-box">
                    <select id="signRole" class="form-control" required>
                        <option value="" disabled selected>Select Role</option>
                        <option value="Rusher">Rusher</option>
                        <option value="Assaulter">Assaulter</option>
                        <option value="Supporter">Supporter</option>
                        <option value="Sniper">Sniper</option>
                    </select>
                </div>
                <div class="input-box"><i class="fa-solid fa-envelope"></i><input type="email" id="signEmail" class="form-control" placeholder="Email" required></div>
                <div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="signPass" class="form-control" placeholder="Password" required></div>
                <button type="submit" class="btn" style="width: 100%; background: var(--success);">Register Account</button>
            </form>

            <p id="authToggleText" style="margin-top: 16px; font-size: 13px; color: var(--text-muted); cursor: pointer;" onclick="toggleAuthMode()">Need an account? <b>Sign Up</b></p>
        </div>

        <!-- Dashboard -->
        <div id="userDashboard" class="hidden animate-enter">
            <div class="grid-layout">
                <div>
                    <div class="card" style="text-align: center;">
                        <div class="avatar" id="dashAvatar" style="margin: 0 auto 12px auto; width: 60px; height: 60px; font-size: 20px;">NX</div>
                        <h3 id="dashName" style="font-size: 16px; font-weight: 700;">Name</h3>
                        <p id="dashMeta" style="font-size: 12px; color: var(--accent); margin: 4px 0;">Role</p>
                        <p id="dashBio" style="font-size: 12px; color: var(--text-muted); font-style: italic; margin-bottom: 16px;">"Bio here"</p>
                        
                        <div style="text-align: left; font-size: 12px; color: var(--text-muted); margin-bottom: 14px; border-top: 1px solid var(--border); padding-top: 10px;">
                            <p><i class="fa-brands fa-discord" style="color: #5865F2;"></i> Discord: <span id="dashDiscord">N/A</span></p>
                            <p><i class="fa-brands fa-youtube" style="color: #FF0000;"></i> YouTube: <span id="dashYoutube">N/A</span></p>
                        </div>

                        <button class="btn btn-outline" style="width: 100%; margin-bottom: 8px;" onclick="openSettings()"><i class="fa-solid fa-gear"></i> Settings</button>
                        <button class="btn btn-danger" style="width: 100%;" onclick="logout()"><i class="fa-solid fa-power-off"></i> Logout</button>
                    </div>
                </div>

                <div>
                    <div class="card">
                        <form id="postForm">
                            <textarea id="postText" class="form-control" rows="3" placeholder="Broadcast tactical updates..." style="padding-left: 14px; resize: none;" required></textarea>
                            <div class="input-box" style="margin-top: 10px; margin-bottom: 0;">
                                <i class="fa-solid fa-image"></i>
                                <input type="text" id="postImage" class="form-control" placeholder="Optional Image/Banner URL...">
                            </div>
                            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Publish Broadcast</button>
                        </form>
                    </div>
                    <div id="feedContainer"></div>
                </div>

                <div>
                    <div class="card" style="margin-bottom: 15px;">
                        <div class="input-box" style="margin-bottom: 0;"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="searchInput" class="form-control" placeholder="Search records..." oninput="filterFeed()"></div>
                    </div>
                    <div class="card">
                        <h4 style="font-size: 14px; margin-bottom: 10px; color: var(--accent);"><i class="fa-solid fa-chart-line"></i> Hub Stats</h4>
                        <p style="font-size: 12px; color: var(--text-muted);">Total Active Posts: <b id="statTotalPosts" style="color: var(--text-main);">0</b></p>
                        <p style="font-size: 12px; color: var(--text-muted);">System Status: <b style="color: var(--success);">Online & Secure</b></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsSection" class="card hidden animate-enter" style="max-width: 480px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: 16px; color: var(--accent);">Profile Configuration</h3>
                <button class="btn btn-outline" style="padding: 4px 10px;" onclick="closeSettings()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="settingsForm">
                <div class="input-box"><input type="text" id="setFullName" class="form-control" style="padding-left:14px;" placeholder="Full Name" required></div>
                <div class="input-box"><input type="text" id="setUid" class="form-control" style="padding-left:14px;" placeholder="UID" required></div>
                <div class="input-box">
                    <select id="setRole" class="form-control" required>
                        <option value="Rusher">Rusher</option>
                        <option value="Assaulter">Assaulter</option>
                        <option value="Supporter">Supporter</option>
                        <option value="Sniper">Sniper</option>
                    </select>
                </div>
                <div class="input-box"><input type="text" id="setBio" class="form-control" style="padding-left:14px;" placeholder="Bio"></div>
                <div class="input-box"><input type="text" id="setDiscord" class="form-control" style="padding-left:14px;" placeholder="Discord Username"></div>
                <div class="input-box"><input type="text" id="setYoutube" class="form-control" style="padding-left:14px;" placeholder="YouTube Channel Link"></div>
                <button type="submit" class="btn" style="width: 100%; background: var(--success);">Save Changes</button>
            </form>
        </div>
    </div>

    <div id="toastBox"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCdzsLgKC5ssl9ZA1yeGLIpmOkNGC7lXKM",
          authDomain: "ff-esports-hub-eb964.firebaseapp.com",
          projectId: "ff-esports-hub-eb964",
          storageBucket: "ff-esports-hub-eb964.firebasestorage.app",
          messagingSenderId: "44678895159",
          appId: "1:44678895159:web:29225572f8c7fee106d1b2",
          measurementId: "G-62FQQCRS5K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let feedCache = [];

        function showToast(msg) {
            const box = document.getElementById('toastBox');
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerText = msg;
            box.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        window.toggleTheme = function() {
            const h = document.documentElement;
            h.setAttribute("data-theme", h.getAttribute("data-theme") === "dark" ? "light" : "dark");
        }

        let isSign = false;
        window.toggleAuthMode = function() {
            isSign = !isSign;
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('signupForm').classList.toggle('hidden');
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const cred = await createUserWithEmailAndPassword(auth, document.getElementById('signEmail').value, document.getElementById('signPass').value);
                await setDoc(doc(db, "users", cred.user.uid), {
                    fullName: document.getElementById('signName').value,
                    freeFireUid: document.getElementById('signUid').value,
                    esportsRole: document.getElementById('signRole').value,
                    email: document.getElementById('signEmail').value,
                    bio: "Elite Member",
                    discord: "N/A",
                    youtube: "N/A"
                });
                showToast("Registered Successfully!");
            } catch (err) { alert(err.message); }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('logEmail').value, document.getElementById('logPass').value);
                showToast("Welcome Back!");
            } catch (err) { alert(err.message); }
        });

        window.logout = function() { signOut(auth); }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if(!user) return;
            const uDoc = await getDoc(doc(db, "users", user.uid));
            const uData = uDoc.exists() ? uDoc.data() : {};

            await setDoc(doc(collection(db, "posts")), {
                authorName: uData.fullName || "Gamer",
                authorUid: uData.freeFireUid || "N/A",
                authorRole: uData.esportsRole || "Member",
                content: document.getElementById('postText').value,
                image: document.getElementById('postImage').value || "",
                likes: 0
            });
            document.getElementById('postText').value = "";
            document.getElementById('postImage').value = "";
            showToast("Broadcast Published!");
            loadFeed();
        });

        window.likePost = function(btn) {
            let span = btn.querySelector('.l-count');
            span.innerText = btn.classList.contains('active') ? parseInt(span.innerText) - 1 : parseInt(span.innerText) + 1;
            btn.classList.toggle('active');
            showToast(btn.classList.contains('active') ? "Post Liked!" : "Like Removed");
        }

        window.openSettings = async function() {
            const user = auth.currentUser;
            if(!user) return;
            const docSnap = await getDoc(doc(db, "users", user.uid));
            if(docSnap.exists()) {
                const d = docSnap.data();
                document.getElementById('setFullName').value = d.fullName || "";
                document.getElementById('setUid').value = d.freeFireUid || "";
                document.getElementById('setRole').value = d.esportsRole || "Rusher";
                document.getElementById('setBio').value = d.bio || "";
                document.getElementById('setDiscord').value = d.discord || "";
                document.getElementById('setYoutube').value = d.youtube || "";
            }
            document.getElementById('settingsSection').classList.remove('hidden');
            document.getElementById('userDashboard').classList.add('hidden');
        }

        window.closeSettings = function() {
            document.getElementById('settingsSection').classList.add('hidden');
            document.getElementById('userDashboard').classList.remove('hidden');
        }

        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if(!user) return;
            await updateDoc(doc(db, "users", user.uid), {
                fullName: document.getElementById('setFullName').value,
                freeFireUid: document.getElementById('setUid').value,
                esportsRole: document.getElementById('setRole').value,
                bio: document.getElementById('setBio').value,
                discord: document.getElementById('setDiscord').value,
                youtube: document.getElementById('setYoutube').value
            });
            showToast("Profile Updated!");
            closeSettings();
            loadUser(user.uid);
        });

        onAuthStateChanged(auth, async (user) => {
            if(user) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('userDashboard').classList.remove('hidden');
                loadUser(user.uid);
                loadFeed();
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('userDashboard').classList.add('hidden');
                document.getElementById('settingsSection').classList.add('hidden');
            }
        });

        async function loadUser(uid) {
            const d = await getDoc(doc(db, "users", uid));
            if(d.exists()) {
                const data = d.data();
                document.getElementById('dashName').innerText = data.fullName;
                document.getElementById('dashMeta').innerText = `${data.esportsRole} • UID: ${data.freeFireUid}`;
                document.getElementById('dashBio').innerText = `"${data.bio}"`;
                document.getElementById('dashDiscord').innerText = data.discord || "N/A";
                document.getElementById('dashYoutube').innerText = data.youtube || "N/A";
                document.getElementById('dashAvatar').innerText = data.fullName.substring(0,2).toUpperCase();
            }
        }

        async function loadFeed() {
            const snap = await getDocs(collection(db, "posts"));
            feedCache = [];
            snap.forEach(d => feedCache.push({ id: d.id, ...d.data() }));
            document.getElementById('statTotalPosts').innerText = feedCache.length;
            renderFeed(feedCache);
        }

        function renderFeed(posts) {
            let html = "";
            posts.forEach(p => {
                let imgTag = p.image ? `<img src="${p.image}" style="width:100%; border-radius:10px; margin-bottom:10px; max-height:250px; object-fit:cover;" onerror="this.style.display='none'">` : '';
                html += `
                    <div class="post-card animate-enter">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                            <div class="avatar" style="width: 36px; height: 36px; font-size: 13px;">${p.authorName.substring(0,2).toUpperCase()}</div>
                            <div>
                                <h4 style="font-size: 13px; font-weight: 700;">${p.authorName} <span class="badge">${p.authorRole}</span></h4>
                                <span style="font-size: 11px; color: var(--text-muted);">UID: ${p.authorUid}</span>
                            </div>
                        </div>
                        <p style="font-size: 13px; color: var(--text-main); margin-bottom: 10px;">${p.content}</p>
                        ${imgTag}
                        <div class="actions-bar">
                            <button class="action-btn" onclick="likePost(this)"><i class="fa-regular fa-heart"></i> Like (<span class="l-count">${p.likes}</span>)</button>
                            <button class="action-btn" onclick="showToast('Comments box active')"><i class="fa-regular fa-comment"></i> Comment</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('feedContainer').innerHTML = html || "<p style='color: var(--text-muted); text-align: center;'>No posts found.</p>";
        }

        window.filterFeed = function() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderFeed(feedCache.filter(p => p.content.toLowerCase().includes(q) || p.authorName.toLowerCase().includes(q)));
        }
    </script>
</body>
</html>
